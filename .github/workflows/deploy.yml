name: Deploy

on:
  # Every push to main.
  push:
    branches: [main]

  # And once a day, so the GitHub activity feed and the Medium posts stay
  # current without you pushing anything. 06:12 UTC — an off-the-hour minute
  # so we're not queued behind the whole world's midnight cron.
  schedule:
    - cron: '12 6 * * *'

  # And whenever you want it, from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pulls GitHub + Medium data, then builds. The token lifts the API rate
      # limit and unlocks the contribution graph (GraphQL needs auth).
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # enablement turns Pages on for the repo on the first run, so there's no
      # manual step in Settings before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
