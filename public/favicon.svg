<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tarsha de Souza">
  <!--
    TD in Instrument Serif italic — the same face, and the same slant, as
    "de Souza" in the hero.

    The outlines are the real glyphs, lifted from
    @fontsource/instrument-serif's italic file with fontkit and baked in as a
    path. Baked rather than generated at build time so the repo needs no
    font-parsing dependency, and so a favicon can never depend on a font the
    browser has not loaded. Regenerate by re-running that extraction if the
    typeface ever changes.
  -->
